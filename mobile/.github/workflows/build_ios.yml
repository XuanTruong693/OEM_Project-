name: Build Flutter iOS IPA (Root)

on:
  push:
    branches:
      - mobile-only
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy .env and Asset Placeholders
        run: |
          echo "Creating dummy .env and placeholders if not already present"
          mkdir -p assets/images assets/files
          [ -f .env ] || echo "API_URL=https://dummy.com" > .env
          [ -f assets/.env ] || echo "API_URL=https://dummy.com" > assets/.env
          mkdir -p ios && ([ -f ios/.env ] || echo "API_URL=https://dummy.com" > ios/.env)
          mkdir -p ios/Runner && ([ -f ios/Runner/.env ] || echo "API_URL=https://dummy.com" > ios/Runner/.env)
          touch assets/images/.gitkeep assets/files/.gitkeep

      - name: Install dependencies
        env:
          PUB_SUMMARY_ONLY: "true"
        run: flutter pub get

      - name: Build iOS App Bundle
        run: |
          echo "Attempting to build with Flutter CLI"
          flutter build ios --release --no-codesign || true
          
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app generated successfully!"
          else
            echo "Retrying with xcodebuild directly from within the ios folder"
            cd ios
            xcodebuild -workspace Runner.xcworkspace \
                       -scheme Runner \
                       -configuration Release \
                       -sdk iphoneos \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean build || true
            cd ..
          fi
          
          echo "Checking final artifact presence"
          if [ -d "build/ios/iphoneos/Runner.app" ] || [ -d "ios/build/Release-iphoneos/Runner.app" ]; then
            echo "Success! Runner.app found!"
          else
            echo "Error: Runner.app not found in any output paths!"
            exit 1
          fi

      - name: Create Unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || true
          cp -r ios/build/Release-iphoneos/Runner.app Payload/ || true
          zip -r Runner.ipa Payload

      - name: Archive IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ipa-build
          path: mobile/Runner.ipa

name: Build Flutter iOS IPA (Root)

on:
  push:
    branches:
      - mobile-only
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA (No codesign)
        run: flutter build ipa --no-codesign

      - name: Archive IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build
          path: build/ios/archive/Runner.xcarchive
